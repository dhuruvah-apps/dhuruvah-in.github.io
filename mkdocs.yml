INHERIT: ./mkdocs.env.yml
site_name: Dhuruvah Apps
site_description: All apps by Dhuruvah
site_url: https://dhuruvah.in/
repo_name: dhuruvah-apps/dhuruvah-in.github.io
repo_url: https://github.com/dhuruvah-apps/dhuruvah-in.github.io
theme:
  name: material
  custom_dir: docs/overrides
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/lightbulb-auto
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: blue grey
    accent: teal
    toggle:
      icon: material/lightbulb
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: blue grey
    accent: teal
    toggle:
      icon: material/lightbulb-outline
      name: Switch to system preference
  features:
  - content.code.annotate
  - content.code.copy
  # - content.code.select
  - content.footnote.tooltips
  - navigation.tabs
  - content.tabs.link
  - navigation.tabs.sticky
  - content.tooltips
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.instant.prefetch
  # - navigation.instant.preview
  - navigation.instant.progress
  - navigation.path
  - navigation.top
  - navigation.tracking
  - search.highlight
  - search.share
  - search.suggest
  - toc.follow

  icon:
    repo: fontawesome/brands/github-alt
  logo: assets/images/DhuruvahApps.png
  favicon: img/icon.ico
  language: en
plugins:
  # Material for MkDocs
  search:
  social:
  typeset:

nav:
  - index.md

markdown_extensions:
  # Material for MkDocs
  material.extensions.preview:
    targets:
      include:
        - "*"
  # Python Markdown
  abbr:
  attr_list:
  footnotes:
  md_in_html:
  tables:
  toc:
    permalink: true

  # Python Markdown Extensions
  pymdownx.betterem:
    smart_enable: all
  pymdownx.caret:
  pymdownx.highlight:
    line_spans: __span
  pymdownx.inlinehilite:
  pymdownx.keys:
  pymdownx.mark:
  pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
  pymdownx.tilde:

  # pymdownx blocks
  pymdownx.blocks.admonition:
    types:
    - note
    - attention
    - caution
    - danger
    - error
    - tip
    - hint
    - warning
  pymdownx.blocks.details:
  pymdownx.blocks.tab:
    alternate_style: True

  # Other extensions
  mdx_include:

extra:
  social:
  - icon: fontawesome/brands/github-alt
    link: https://github.com/dhuruvah-apps
  - icon: fontawesome/brands/twitter
    link: https://twitter.com/dhuruvah
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/in/dhuruvah
  - icon: fontawesome/brands/dev
    link: https://dev.to/dhuruvah
  - icon: fontawesome/brands/medium
    link: https://medium.com/@dhuruvah
  - icon: fontawesome/solid/globe
    link: https://dhuruvah.in
  - icon: fontawesome/solid/envelope
    link: mailto:dhuruvah@gmail.com

extra_css:
  - css/termynal.css
  - css/custom.css

extra_javascript:
  - js/termynal.js
  - js/custom.js

hooks:
  - scripts/mkdocs_hooks.py
